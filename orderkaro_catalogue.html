<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORDER KARO – Product Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:#f4f9f7;color:#1a1a1a;min-height:100vh}

  /* ── Header ── */
  .header{background:#fff;padding:20px 20px 16px;border-bottom:1px solid #e0ede9;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(18,140,126,0.07)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand-icon{width:40px;height:40px;background:#128C7E;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .brand-name{font-size:20px;font-weight:700;color:#128C7E;letter-spacing:-0.3px}
  .brand-tag{font-size:12px;color:#888;font-weight:400}
  .search-bar{display:flex;align-items:center;gap:8px;background:#f4f9f7;border:1.5px solid #d0e9e3;border-radius:10px;padding:8px 14px}
  .search-bar svg{flex-shrink:0;color:#128C7E}
  .search-bar input{border:none;background:transparent;font-size:14px;font-family:'Nunito',sans-serif;width:100%;outline:none;color:#1a1a1a}
  .search-bar input::placeholder{color:#aaa}

  /* ── Filters ── */
  .filters{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;background:#fff;border-bottom:1px solid #e0ede9;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .f-btn{white-space:nowrap;padding:6px 16px;border-radius:20px;border:1.5px solid #d0e9e3;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#666;font-family:'Nunito',sans-serif;transition:all 0.15s}
  .f-btn.active{background:#128C7E;color:#fff;border-color:#128C7E}

  /* ── Grid ── */
  .grid-wrap{padding:16px 20px 120px}
  .section-label{font-size:13px;font-weight:700;color:#128C7E;text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}

  /* ── Card ── */
  .card{background:#fff;border:1.5px solid #e8f4f1;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;transition:all 0.15s;cursor:default}
  .card:hover{border-color:#128C7E;box-shadow:0 2px 12px rgba(18,140,126,0.1)}
  .card.selected{border-color:#128C7E;background:#f0faf7}
  .emoji{font-size:30px;text-align:center;padding:6px 0 4px}
  .p-name{font-size:13px;font-weight:700;color:#1a1a1a;line-height:1.3}
  .p-unit{font-size:11px;color:#999;margin-bottom:2px}
  .p-price{font-size:16px;font-weight:700;color:#128C7E}
  .qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;background:#f4f9f7;border-radius:8px;padding:5px 8px}
  .qty-row span{font-size:11px;color:#888;font-weight:600}
  .qty-ctrl{display:flex;align-items:center;gap:6px}
  .qbtn{width:22px;height:22px;border-radius:50%;border:1.5px solid #d0e9e3;background:#fff;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;color:#128C7E;font-weight:700;transition:all 0.1s;font-family:'Nunito',sans-serif}
  .qbtn:hover{background:#128C7E;color:#fff;border-color:#128C7E}
  .qnum{font-size:13px;font-weight:700;min-width:16px;text-align:center;color:#1a1a1a}
  .in-cart{display:inline-block;font-size:10px;background:#e0faf3;color:#0a6b57;border-radius:6px;padding:1px 7px;margin-left:4px;font-weight:700}

  /* ── Empty ── */
  .empty{text-align:center;padding:40px 20px;color:#aaa;font-size:14px}
  .empty-icon{font-size:40px;margin-bottom:8px}

  /* ── Cart Bar ── */
  .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#128C7E;padding:12px 20px;display:none;align-items:center;justify-content:space-between;z-index:200;box-shadow:0 -4px 20px rgba(18,140,126,0.25)}
  .cart-bar.visible{display:flex}
  .cart-info .items{font-size:12px;color:rgba(255,255,255,0.8);font-weight:600}
  .cart-info .total{font-size:18px;font-weight:700;color:#fff}
  .wa-btn{display:flex;align-items:center;gap:8px;background:#25D366;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:background 0.15s}
  .wa-btn:hover{background:#1ebe5d}
  .wa-btn svg{flex-shrink:0}

  @media(max-width:480px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .header{padding:14px 14px 12px}
    .grid-wrap{padding:12px 14px 120px}
    .filters{padding:10px 14px}
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand-row">
    <div class="brand-icon">🛒</div>
    <div>
      <div class="brand-name">ORDER KARO</div>
      <div class="brand-tag">Fresh groceries, delivered fast</div>
    </div>
  </div>
  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search products, e.g. rice, dal, oil…" oninput="render()"/>
  </div>
</div>

<div class="filters" id="filters"></div>
<div class="grid-wrap" id="gridWrap"></div>

<div class="cart-bar" id="cartBar">
  <div class="cart-info">
    <div class="items" id="cartCount"></div>
    <div class="total" id="cartTotal"></div>
  </div>
  <button class="wa-btn" onclick="sendToWhatsApp()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Order on WhatsApp
  </button>
</div>

<script>
const WHATSAPP = "918102486293";

const products = [
  {id:"P001",name:"Aata (Wheat Flour)",cat:"Staples",emoji:"🌾",price:260,unit:"10 kg"},
  {id:"P002",name:"Basmati Rice",cat:"Staples",emoji:"🍚",price:180,unit:"5 kg"},
  {id:"P003",name:"Tata Salt",cat:"Staples",emoji:"🧂",price:28,unit:"1 kg"},
  {id:"P004",name:"Sugar",cat:"Staples",emoji:"🍬",price:55,unit:"1 kg"},
  {id:"P005",name:"Poha",cat:"Staples",emoji:"🍛",price:45,unit:"500 g"},
  {id:"P006",name:"Chana Dal",cat:"Pulses",emoji:"🫘",price:120,unit:"1 kg"},
  {id:"P007",name:"Moong Dal",cat:"Pulses",emoji:"🫛",price:140,unit:"1 kg"},
  {id:"P008",name:"Toor Dal",cat:"Pulses",emoji:"🟡",price:130,unit:"1 kg"},
  {id:"P009",name:"Urad Dal",cat:"Pulses",emoji:"⚪",price:125,unit:"1 kg"},
  {id:"P010",name:"Amul Butter",cat:"Dairy",emoji:"🧈",price:55,unit:"100 g"},
  {id:"P011",name:"Amul Milk",cat:"Dairy",emoji:"🥛",price:68,unit:"1 L"},
  {id:"P012",name:"Dahi (Curd)",cat:"Dairy",emoji:"🥣",price:50,unit:"500 g"},
  {id:"P013",name:"Paneer",cat:"Dairy",emoji:"🧀",price:90,unit:"200 g"},
  {id:"P014",name:"Tomato",cat:"Vegetables",emoji:"🍅",price:40,unit:"1 kg"},
  {id:"P015",name:"Onion",cat:"Vegetables",emoji:"🧅",price:35,unit:"1 kg"},
  {id:"P016",name:"Potato",cat:"Vegetables",emoji:"🥔",price:30,unit:"1 kg"},
  {id:"P017",name:"Ginger-Garlic Paste",cat:"Vegetables",emoji:"🌿",price:45,unit:"200 g"},
  {id:"P018",name:"Sunflower Oil",cat:"Oils",emoji:"🌻",price:155,unit:"1 L"},
  {id:"P019",name:"Mustard Oil",cat:"Oils",emoji:"🫙",price:170,unit:"1 L"},
  {id:"P020",name:"Haldi Powder",cat:"Spices",emoji:"🟡",price:48,unit:"100 g"},
  {id:"P021",name:"Red Chilli Powder",cat:"Spices",emoji:"🌶️",price:55,unit:"100 g"},
  {id:"P022",name:"Cumin (Jeera)",cat:"Spices",emoji:"🌰",price:60,unit:"100 g"},
  {id:"P023",name:"Maggi Noodles",cat:"Snacks",emoji:"🍜",price:14,unit:"70 g"},
  {id:"P024",name:"Parle-G Biscuit",cat:"Snacks",emoji:"🍪",price:10,unit:"100 g"},
];

const cats = ["All", ...new Set(products.map(p=>p.cat))];
let activeCat = "All";
let cart = {};

// Build filters
const filtersEl = document.getElementById("filters");
cats.forEach(c => {
  const b = document.createElement("button");
  b.className = "f-btn" + (c==="All"?" active":"");
  b.textContent = c;
  b.onclick = () => {
    activeCat = c;
    document.querySelectorAll(".f-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
  filtersEl.appendChild(b);
});

function render() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const filtered = products.filter(p => {
    const matchCat = activeCat==="All" || p.cat===activeCat;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  const wrap = document.getElementById("gridWrap");

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>No products found.<br>Try a different search.</div>';
    updateCartBar();
    return;
  }

  // Group by category
  const grouped = {};
  filtered.forEach(p => {
    if (!grouped[p.cat]) grouped[p.cat] = [];
    grouped[p.cat].push(p);
  });

  let html = "";
  Object.entries(grouped).forEach(([cat, items]) => {
    if (activeCat === "All") html += `<div class="section-label">${cat}</div>`;
    html += '<div class="grid">';
    items.forEach(p => {
      const qty = cart[p.id] || 0;
      html += `
        <div class="card${qty>0?' selected':''}" id="card-${p.id}">
          <div class="emoji">${p.emoji}</div>
          <div class="p-name">${p.name}${qty>0?'<span class="in-cart">✓ added</span>':''}</div>
          <div class="p-unit">${p.unit}</div>
          <div class="p-price">₹${p.price}</div>
          <div class="qty-row">
            <span>Qty</span>
            <div class="qty-ctrl">
              <button class="qbtn" onclick="changeQty('${p.id}',-1)">−</button>
              <span class="qnum">${qty}</span>
              <button class="qbtn" onclick="changeQty('${p.id}',1)">+</button>
            </div>
          </div>
        </div>`;
    });
    html += '</div>';
  });

  wrap.innerHTML = html;
  updateCartBar();
}

function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id]||0) + delta);
  render();
}

function updateCartBar() {
  const items = Object.entries(cart).filter(([,q])=>q>0);
  const bar = document.getElementById("cartBar");
  if (!items.length) { bar.classList.remove("visible"); return; }
  bar.classList.add("visible");
  const total = items.reduce((s,[id,q]) => { const p=products.find(x=>x.id===id); return s+p.price*q; }, 0);
  const count = items.reduce((s,[,q])=>s+q, 0);
  document.getElementById("cartCount").textContent = count + " item" + (count>1?"s":"") + " in cart";
  document.getElementById("cartTotal").textContent = "Total: ₹" + total;
}

function sendToWhatsApp() {
  const items = Object.entries(cart).filter(([,q])=>q>0);
  if (!items.length) return;
  const total = items.reduce((s,[id,q]) => { const p=products.find(x=>x.id===id); return s+p.price*q; }, 0);
  let msg = "🛒 *ORDER KARO – New Order*\n";
  msg += "━━━━━━━━━━━━━━━━━━━━\n";
  msg += "*Items Ordered:*\n";
  items.forEach(([id,q]) => {
    const p = products.find(x=>x.id===id);
    msg += `. ${p.name} (${p.unit}) × ${q}  =  ₹${p.price*q}\n`;
  });
  msg += "━━━━━━━━━━━━━━━━━━━━\n";
  msg += `*Order Total: ₹${total}*\n`;
  msg += "━━━━━━━━━━━━━━━━━━━━\n";
  msg += "Please confirm my order. Thank you! 🙏";
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank");
}

render();
</script>
</body>
</html>
